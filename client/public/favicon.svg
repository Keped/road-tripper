<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Radar Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Winding Route Line (Pulse Path) -->
  <path d="M 110 390 C 160 390, 160 290, 240 290 C 320 290, 310 170, 390 120" 
        fill="none" 
        stroke="url(#roadGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#neonGlow)"/>

  <!-- Route Inner Dash -->
  <path d="M 110 390 C 160 390, 160 290, 240 290 C 320 290, 310 170, 390 120" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-dasharray="14 14" 
        opacity="0.9"/>

  <!-- Origin Node -->
  <circle cx="110" cy="390" r="18" fill="#06b6d4" filter="url(#beaconGlow)"/>
  <circle cx="110" cy="390" r="8" fill="#ffffff"/>

  <!-- Destination Beacon Node -->
  <circle cx="390" cy="120" r="28" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6"/>
  <circle cx="390" cy="120" r="20" fill="#10b981" filter="url(#beaconGlow)"/>
  <circle cx="390" cy="120" r="8" fill="#ffffff"/>

  <!-- Navigation GPS Arrow / Co-Pilot Icon -->
  <g transform="translate(240, 290) rotate(45)">
    <path d="M 0 -26 L 20 22 L 0 12 L -20 22 Z" fill="#ffffff" filter="url(#beaconGlow)"/>
    <path d="M 0 -20 L 14 18 L 0 10 L -14 18 Z" fill="#10b981"/>
  </g>
</svg>
